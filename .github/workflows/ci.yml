# CI (PR-07A, D-028): the same `pnpm check` as locally, with the PostgreSQL
# integration tests required (a missing database or missing pg_dump/pg_restore
# fails the run instead of skipping). Actions are pinned to commit SHAs.
# Push runs only on the default branch; other branches are checked through their
# pull request, so a same-repo PR gets one run, not two.
name: CI

on:
  push:
    # The repository's default branch: update if the default branch is renamed.
    branches: [ccr-919f3e62-g6j3w9]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # pg_dump/pg_restore for the backup/restore test: the server's major (16) exactly, not
      # the `postgresql-client` meta package (on the runner image it pulls the newest client).
      # pg_dump >= 17 writes `SET transaction_timeout`, which a 16 server rejects, so
      # `pg_restore --exit-on-error --single-transaction` fails. Ubuntu 26.04 ships only the
      # 18 client, so the PGDG repository (apt.postgresql.org) is added first with the script
      # and signing key shipped in postgresql-common (the script runs apt-get update itself).
      # The versioned binaries go first on PATH for the later steps.
      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          bindir=/usr/lib/postgresql/16/bin
          for tool in pg_dump pg_restore; do
            version="$("$bindir/$tool" --version)"
            echo "$version"
            major="$(echo "$version" | sed -E 's/.*\(PostgreSQL\) ([0-9]+).*/\1/')"
            if [ "$major" != "16" ]; then
              echo "::error::$tool major $major does not match the PostgreSQL 16 server"
              exit 1
            fi
          done
          echo "$bindir" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      # --prod: production dependencies must be free of known advisories; dev-only
      # advisories (tooling never shipped or run in production) do not block CI. They are
      # still covered by the full `pnpm audit` in Code & Safety Review (docs/SECURITY.md §13).
      - run: pnpm audit --prod

      - run: pnpm check
        env:
          CI: "true"
          REQUIRE_DB_TESTS: "1"
          TEST_DATABASE_URL: postgres://radar:radar@localhost:5432/radar_test
