# Radar Zamówień — `serve` with EMAIL_MODE=smtp (D-031), docs/DEPLOY.md point 7.
# Required in smtp mode, not needed (and better left out) in EMAIL_MODE=test.
# Install as root, next to the unit:
#   install -d -m 0755 /etc/systemd/system/radar-serve.service.d
#   install -m 0644 /opt/radar-zamowien/deploy/systemd/radar-serve.service.d/smtp.conf \
#     /etc/systemd/system/radar-serve.service.d/
#   systemctl daemon-reload && systemctl restart radar-serve
#   systemctl show radar-serve -p IPAddressDeny    # IPAddressDeny= (empty)
#
# radar-serve.service lets `serve` reach the loopback only (IPAddressDeny=any,
# IPAddressAllow=localhost). In smtp mode it sends the access e-mails to
# SMTP_URL's host, whose addresses belong to the provider and may change, so
# this drop-in empties the deny list (an empty assignment resets it). With it,
# systemd does not restrict `serve`'s outbound traffic at all (any host, any
# port), exactly as for the digest, the alerts and `ingest`, which run from
# cron (deploy/cron/radar) without a systemd filter; only a host firewall with
# egress rules restricts it. The code still opens only PostgreSQL and SMTP
# connections.
#
# Stricter alternative, only when the provider publishes fixed address ranges:
# instead of the empty IPAddressDeny= below, keep the deny list and add the
# ranges (IPAddressAllow= entries add to the unit's localhost), e.g.
#   IPAddressAllow=192.0.2.0/24
# plus the DNS resolver's address when it is not on the host (systemd-resolved
# at 127.0.0.53 is loopback, already allowed). A range the provider changes then
# stops the e-mails ("send_failed" in the log) until the drop-in is updated.

[Service]
IPAddressDeny=
